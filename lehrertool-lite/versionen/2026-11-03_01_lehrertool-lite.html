<script>
'use strict';
/* =================== Sitzplan bearbeiten =================== */
function seatOrder(room){ // vorne (Tafel) zuerst: Tische nach Nummer, sonst nach Abstand zur Tafel
  const by = room.board ? (s => -(s.y)) : (s => s.y);
  return seatsOf(room).sort((a,b) => {
    const la = parseInt(a.table.label), lb = parseInt(b.table.label);
    if (!isNaN(la) && !isNaN(lb) && la !== lb) return la - lb;
    return by(a) - by(b) || a.x - b.x;
  });
}
function renderEdit(stage){
  const L = ui.ctx, c = course(L.cid), room = S.rooms[L.room];
  const F = roomFrame(stage, room), map = liveMap(c, L.room), names = displayNames(c);
  for (const seat of F.seats){
    const t = document.createElement('div'); t.style.cssText = tileBox(F, seat); t.dataset.seat = seat.id;
    const sid = map[seat.id];
    if (!sid){ t.className = 'tile empty ed'; F.el.appendChild(t); continue; }
    t.className = 'tile ed' + (ui.sel === sid ? ' sel' : ''); t.dataset.sid = sid;
    t.innerHTML = `<div class="tn"><span class="nm">${esc(names[sid])}</span></div><div class="ebody">${esc(stu(c,sid).cls||'')}</div>`;
    F.el.appendChild(t);
  }
  const side = $('#side'); side.classList.remove('hidden');
  const un = unseated(c, L.room), arch = c.students.filter(s => s.archived), sel = ui.sel && stu(c, ui.sel);
  side.innerHTML = `<h2 style="margin:0 0 6px">Sitzplan ${esc(c.name)}</h2>
    <div class="small muted">Raum ${esc(room.id)} · Ziehen oder antippen → Platz antippen. Besetzter Platz = tauschen.</div>
    <div class="row" style="margin:10px 0"><button class="pri" id="sImp">Namen einfügen</button><button id="sDemo">Demo-Namen</button></div>
    <div class="row"><button id="sAlpha">Alphabetisch verteilen</button><button id="sRand">Zufällig verteilen</button></div>
    <div class="row" style="margin-top:6px"><button id="sClear">Alle Plätze leeren</button><button id="sRoom">Raum ${esc(room.id)} bearbeiten</button></div>
    ${sel ? `<div class="card" style="margin-top:12px"><b>${esc(sel.first)} ${esc(sel.last)}</b>
      <div class="row" style="margin-top:8px"><input type="text" id="sFirst" value="${esc(sel.first)}" style="width:46%"><input type="text" id="sLast" value="${esc(sel.last)}" style="width:46%"></div>
      <div class="row" style="margin-top:6px"><input type="text" id="sCls" value="${esc(sel.cls||'')}" placeholder="Klasse" style="width:30%">
      <button id="sSave">Übernehmen</button><button class="danger" id="sArch">Archivieren</button></div>
      <div class="small muted" style="margin-top:6px">Archivieren: Person verlässt den Kurs, alle Einträge bleiben erhalten.</div></div>` : ''}
    <h3>Ohne Platz (${un.length})</h3>
    <div class="unseat" data-unseat="1">${un.map(s => `<span class="uitem ${ui.sel===s.id?'sel':''}" data-sid="${s.id}">${esc(names[s.id])}</span>`).join('') || '<span class="small muted">hierher ziehen = Platz freigeben</span>'}</div>
    ${arch.length ? `<h3>Archiviert (${arch.length})</h3><div class="small">${arch.map(s=>`<div>${esc(s.first)} ${esc(s.last)} <a href="#" data-rest="${s.id}">zurückholen</a></div>`).join('')}</div>` : ''}
    <button class="pri bigbtn" id="sDone" style="margin-top:16px">Fertig</button>`;
  $('#sImp').onclick = () => importDlg(c);
  $('#sDemo').onclick = () => { addDemo(c); render(); };
  $('#sAlpha').onclick = () => distribute(c, L.room, 'alpha');
  $('#sRand').onclick = () => distribute(c, L.room, 'rand');
  $('#sClear').onclick = async () => { if (await confirmDlg('Alle Plätze in diesem Raum leeren?','Leeren')){ const m = editableSeatMap(c, L.room); for (const k of Object.keys(m)) delete m[k]; changed(); render(); } };
  $('#sRoom').onclick = () => openRoomEditor(L.room);
  $('#sDone').onclick = () => { ui.mode = 'live'; ui.sel = null; render(); };
  if (sel){
    $('#sSave').onclick = () => { sel.first = $('#sFirst').value.trim(); sel.last = $('#sLast').value.trim(); sel.cls = $('#sCls').value.trim(); ui.sel = null; changed(); render(); toast('Übernommen'); };
    $('#sArch').onclick = async () => { if (await confirmDlg(`${esc(sel.first)} ${esc(sel.last)} archivieren?`, 'Archivieren')){ sel.archived = true; ui.sel = null; changed(); render(); } };
  }
  $$('[data-rest]', side).forEach(a => a.onclick = e => { e.preventDefault(); stu(c, a.dataset.rest).archived = false; changed(); render(); });
  stage.onpointerdown = edDown; side.onpointerdown = edDown;
}
let drag = null;
function edDown(e){
  if (ui.view !== 'course' || ui.mode !== 'edit') return;
  const it = e.target.closest('[data-sid]'), seatEl = e.target.closest('[data-seat]');
  if (!it && !seatEl) return;
  if (!it){ if (ui.sel){ e.preventDefault(); placeStudent(ui.sel, seatEl.dataset.seat); } return; }
  e.preventDefault();
  drag = {sid:it.dataset.sid, x0:e.clientX, y0:e.clientY, moved:false, ghost:null, over:null};
  document.addEventListener('pointermove', edMove); document.addEventListener('pointerup', edUp, {once:true});
}
function edMove(e){
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) > 8){
    drag.moved = true; const g = document.createElement('div'); g.className = 'ghost';
    g.textContent = displayNames(course(ui.ctx.cid))[drag.sid]; document.body.appendChild(g); drag.ghost = g;
  }
  if (!drag.moved) return;
  drag.ghost.style.left = (e.clientX+12)+'px'; drag.ghost.style.top = (e.clientY+12)+'px';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tgt = el && (el.closest('[data-seat]') || el.closest('[data-unseat]'));
  if (drag.over && drag.over !== tgt) drag.over.classList.remove('drop');
  if (tgt){ tgt.classList.add('drop'); drag.over = tgt; }
}
function edUp(e){
  document.removeEventListener('pointermove', edMove);
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  if (d.over) d.over.classList.remove('drop');
  if (d.moved){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const seat = el && el.closest('[data-seat]'), uns = el && el.closest('[data-unseat]');
    if (seat) placeStudent(d.sid, seat.dataset.seat);
    else if (uns) unseatStudent(d.sid);
    return;
  }
  // Tippen ohne Ziehen: auswählen / tauschen
  if (ui.sel === d.sid){ ui.sel = null; render(); return; }
  if (ui.sel){
    const el = document.elementFromPoint(e.clientX, e.clientY), seat = el && el.closest('[data-seat]');
    if (seat){ placeStudent(ui.sel, seat.dataset.seat); return; }
  }
  ui.sel = d.sid; render();
}
function placeStudent(sid, seatId){
  const c = course(ui.ctx.cid), roomId = ui.ctx.room, map = editableSeatMap(c, roomId);
  cleanMap(map, S.rooms[roomId], c);
  const cur = Object.keys(map).find(k => map[k] === sid), occ = map[seatId];
  if (cur === seatId){ ui.sel = null; render(); return; }
  map[seatId] = sid;
  if (cur){ if (occ) map[cur] = occ; else delete map[cur]; }
  ui.sel = null; changed(); render();
}
function unseatStudent(sid){
  const c = course(ui.ctx.cid), map = editableSeatMap(c, ui.ctx.room);
  for (const k of Object.keys(map)) if (map[k] === sid) delete map[k];
  ui.sel = null; changed(); render();
}
function distribute(c, roomId, how){
  const map = editableSeatMap(c, roomId), room = S.rooms[roomId];
  cleanMap(map, room, c);
  let list = unseated(c, roomId);
  if (!list.length){ toast('Alle haben schon einen Platz. „Alle Plätze leeren“ für eine Neuverteilung.'); return; }
  if (how === 'alpha') list.sort((a,b) => (a.last+a.first).localeCompare(b.last+b.first, 'de'));
  else for (let i = list.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [list[i], list[j]] = [list[j], list[i]]; }
  const free = seatOrder(room).filter(s => !map[s.id]);
  list.forEach((s, i) => { if (free[i]) map[free[i].id] = s.id; });
  if (list.length > free.length) toast(`${list.length-free.length} Person(en) ohne Platz – Raum hat zu wenige Plätze.`);
  changed(); render();
}
function importDlg(c){
  let parsed = [];
  dialog(`<h2>Namen einfügen – ${esc(c.name)}</h2>
    <p class="small muted">In Excel die Spalten <b>Nachname | Vorname</b> (optional Klasse) markieren, <span class="kbd">Strg+C</span>, hier <span class="kbd">Strg+V</span>.
    Auch „Nachname, Vorname“ pro Zeile geht. Kopfzeile wird erkannt.</p>
    <textarea id="iTxt" style="min-height:150px"></textarea>
    <div class="row" style="margin-top:6px"><button id="iSwap">Vor-/Nachname tauschen</button><label>Klasse (falls leer):</label><input type="text" id="iCls" value="${esc(c.cls||'')}" style="width:90px"></div>
    <div id="iPrev" class="small" style="margin-top:8px;max-height:200px;overflow:auto"></div>`,
    [{t:'Abbrechen'}, {t:'Übernehmen', cls:'pri', f:() => {
      const dc = $('#iCls').value.trim(); let n = 0;
      for (const p of parsed){
        if (c.students.some(s => s.first === p.first && s.last === p.last && !s.archived)) continue;
        c.students.push({id:uid(), first:p.first, last:p.last, cls:p.cls || dc}); n++;
      }
      changed(); toast(`${n} Namen übernommen.`);
      if (n){ ui.mode = 'edit'; render(); setTimeout(() => dialog(`<p>${n} Namen sind in der Liste „Ohne Platz“. Gleich verteilen?</p>`,
        [{t:'Selbst setzen'}, {t:'Zufällig', f:()=>distribute(c, ui.ctx.room, 'rand')}, {t:'Alphabetisch', cls:'pri', f:()=>distribute(c, ui.ctx.room, 'alpha')}]), 50); }
    }}],
    d => {
      const upd = () => { parsed = parseNames($('#iTxt').value);
        $('#iPrev').innerHTML = parsed.length ? `<b>${parsed.length} erkannt:</b><br>` + parsed.slice(0,40).map(p => `Vorname <b>${esc(p.first)}</b> · Nachname <b>${esc(p.last)}</b>${p.cls?' · '+esc(p.cls):''}`).join('<br>') : ''; };
      $('#iTxt').oninput = upd;
      $('#iSwap').onclick = () => { parsed.forEach(p => [p.first, p.last] = [p.last, p.first]); $('#iPrev').innerHTML = parsed.length ? `<b>${parsed.length} erkannt:</b><br>` + parsed.slice(0,40).map(p => `Vorname <b>${esc(p.first)}</b> · Nachname <b>${esc(p.last)}</b>`).join('<br>') : ''; };
      setTimeout(()=>$('#iTxt').focus(), 30);
    });
}
function addDemo(c, n){
  n = n || (24 + Math.floor(Math.random()*6));
  const used = new Set(c.students.map(s => s.first+s.last));
  for (let i = 0, k = 0; i < n && k < 500; k++){
    const f = DEMO_FIRST[Math.floor(Math.random()*DEMO_FIRST.length)], l = DEMO_LAST[Math.floor(Math.random()*DEMO_LAST.length)];
    if (used.has(f+l)) continue; used.add(f+l);
    const cls = c.cls.includes('/') ? c.cls.split('/')[i%2] : c.cls;
    c.students.push({id:uid(), first:f, last:l, cls, demo:true}); i++;
  }
  for (const e of c.schedule){ const room = S.rooms[e.room]; if (!room) continue;
    const map = editableSeatMap(c, e.room); cleanMap(map, room, c);
    const free = seatOrder(room).filter(s => !map[s.id]);
    activeStudents(c).filter(s => !Object.values(map).includes(s.id)).sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first,'de'))
      .forEach((s, i) => { if (free[i]) map[free[i].id] = s.id; });
  }
  changed();
}

/* =================== Raum-Editor =================== */
const WORLD = {w:1400, h:820};
function worldOf(room){ let w = WORLD.w, h = WORLD.h;
  for (const t of room.tables){ w = Math.max(w, t.x + (t.rot?SW:t.n*SW) + 100); h = Math.max(h, t.y + (t.rot?t.n*SH:SH) + 60); }
  if (room.board){ w = Math.max(w, room.board.x + room.board.w + 60); h = Math.max(h, room.board.y + room.board.h + 40); }
  return {w, h}; }
function openRoomEditor(roomId){ ui.editRoomId = roomId; ui.backTo = {view:ui.view, mode:ui.mode, ctx:ui.ctx}; ui.view = 'room'; ui.roomSel = null; render(); }
function renderRoomEditor(stage){
  const room = S.rooms[ui.editRoomId], WD = worldOf(room);
  const aw = stage.clientWidth, ah = stage.clientHeight, s = Math.min(aw/WD.w, ah/WD.h);
  const el = document.createElement('div'); el.className = 'room';
  el.style.cssText = `width:${WD.w*s}px;height:${WD.h*s}px;left:${(aw-WD.w*s)/2}px;top:${(ah-WD.h*s)/2}px;
    background-image:radial-gradient(#cfd3d9 1px,transparent 1px);background-size:${20*s}px ${20*s}px;border:1px dashed #c9ccd2;font-size:${13*s}px`;
  for (const t of room.tables){
    const w = t.rot ? SW : t.n*SW, h = t.rot ? t.n*SH : SH;
    const d = document.createElement('div'); d.className = 'etable' + (ui.roomSel === t.id ? ' sel' : ''); d.dataset.tid = t.id;
    d.style.cssText = `left:${t.x*s}px;top:${t.y*s}px;width:${w*s}px;height:${h*s}px`;
    let inner = '';
    for (let i = 0; i < t.n; i++){ const x = t.rot ? 0 : i*SW, y = t.rot ? i*SH : 0;
      inner += `<div class="eseat" style="left:${(x+6)*s}px;top:${(y+6)*s}px;width:${(SW-12)*s}px;height:${(SH-12)*s}px"></div>`; }
    d.innerHTML = inner + `<div style="position:absolute;left:6px;top:4px;font-weight:700;color:#7a6c55">${esc(t.label||'')}</div>`;
    el.appendChild(d);
  }
  if (room.board){ const b = room.board, d = document.createElement('div'); d.className = 'board etable' + (ui.roomSel === 'board' ? ' sel' : ''); d.dataset.tid = 'board';
    d.style.cssText = `left:${b.x*s}px;top:${b.y*s}px;width:${b.w*s}px;height:${b.h*s}px;background:var(--board)`; d.textContent = 'Tafel'; el.appendChild(d); }
  stage.appendChild(el);
  el.onpointerdown = e => {
    const d = e.target.closest('[data-tid]');
    if (!d){ ui.roomSel = null; render(); return; }
    e.preventDefault();
    const id = d.dataset.tid, obj = id === 'board' ? room.board : room.tables.find(t => t.id === id);
    ui.roomSel = id;
    const sx = e.clientX, sy = e.clientY, ox = obj.x, oy = obj.y; let moved = false;
    $$('.etable', el).forEach(x => x.classList.toggle('sel', x === d));
    const mv = ev => { const dx = (ev.clientX-sx)/s, dy = (ev.clientY-sy)/s; if (Math.abs(dx)+Math.abs(dy) > 3) moved = true;
      obj.x = clamp(Math.round((ox+dx)/10)*10, 0, WD.w-60); obj.y = clamp(Math.round((oy+dy)/10)*10, 0, WD.h-40);
      d.style.left = obj.x*s+'px'; d.style.top = obj.y*s+'px'; };
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', () => { document.removeEventListener('pointermove', mv); if (moved) changed(); render(); }, {once:true});
  };
  const side = $('#side'); side.classList.remove('hidden');
  const t = room.tables.find(x => x.id === ui.roomSel);
  side.innerHTML = `<h2 style="margin:0 0 6px">Raum ${esc(room.id)}</h2>
    <div class="small muted">Tische ziehen (rastet ein). Die Tafel markiert „vorne“. Sitzpläne der Kurse passen sich an; Plätze gelöschter Tische werden frei.</div>
    <h3>Neuer Tisch</h3><div class="row"><select id="rN">${[1,2,3,4,5,6].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('')}</select><span>Plätze</span><button class="pri" id="rAdd">+ Tisch</button></div>
    ${t ? `<div class="card" style="margin-top:12px"><b>Tisch ${esc(t.label||'')}</b>
      <div class="row" style="margin-top:8px"><label>Nr.</label><input type="text" id="rLab" value="${esc(t.label||'')}" style="width:70px">
      <button id="rMinus">− Platz</button><button id="rPlus">+ Platz</button></div>
      <div class="row" style="margin-top:8px"><button id="rRot">↻ Drehen</button><button class="danger" id="rDel">Löschen</button></div></div>` : ''}
    <h3>Vorlagen</h3><div class="row"><button id="rStd">Standard 8 Bänke × 4</button><button id="rU">U-Form …</button><button id="rEmpty">Leeren</button></div>
    <button class="pri bigbtn" id="rDone" style="margin-top:16px">Fertig</button>`;
  $('#rAdd').onclick = () => { const n = +$('#rN').value, nums = room.tables.map(x => parseInt(x.label)).filter(x => !isNaN(x));
    const id = 'T' + uid(); room.tables.push({id, x:40, y:40, n, rot:0, label:String((nums.length ? Math.max(...nums) : 0) + 1)}); ui.roomSel = id; changed(); render(); };
  if (t){
    $('#rLab').onchange = e => { t.label = e.target.value.trim(); changed(); render(); };
    $('#rMinus').onclick = () => { if (t.n > 1){ t.n--; changed(); render(); } };
    $('#rPlus').onclick = () => { if (t.n < 8){ t.n++; changed(); render(); } };
    $('#rRot').onclick = () => { t.rot = t.rot ? 0 : 90; changed(); render(); };
    $('#rDel').onclick = () => { room.tables = room.tables.filter(x => x !== t); ui.roomSel = null; changed(); render(); };
  }
  $('#rStd').onclick = async () => { if (await confirmDlg('Raum auf 8 Bänke × 4 Plätze zurücksetzen?','Zurücksetzen')){ const r = standardRoom(room.id); room.tables = r.tables; room.board = r.board; changed(); render(); } };
  $('#rU').onclick = () => dialog(`<h2>U-Form</h2><p class="small muted">Öffnung zur Tafel. Plätze je Seite:</p>
    <div class="row"><label>links</label><input type="number" id="uL" value="6" min="1" max="12" style="width:64px">
    <label>hinten</label><input type="number" id="uB" value="2" min="0" max="12" style="width:64px">
    <label>rechts</label><input type="number" id="uR" value="7" min="1" max="12" style="width:64px"></div>`,
    [{t:'Abbrechen'}, {t:'Übernehmen', cls:'pri', f:() => { const r = uRoom(room.id, clamp(+$('#uL').value||1,1,12), clamp(+$('#uB').value||0,0,12), clamp(+$('#uR').value||1,1,12));
      room.tables = r.tables.filter(t => t.n > 0); room.board = r.board; delete room.needsSetup; changed(); render(); }}]);
  $('#rEmpty').onclick = async () => { if (await confirmDlg('Alle Tische entfernen?','Leeren')){ room.tables = []; changed(); render(); } };
  $('#rDone').onclick = () => { delete room.needsSetup; changed(); const b = ui.backTo || {view:'home'}; ui.view = b.view; ui.mode = b.mode; ui.ctx = b.ctx; render(); };
}
</script>
<script>
'use strict';
/* =====================================================================
   Noten: Schlüssel, Klassenarbeiten/Tests/Projekte, GFS, Gesamtliste
   ===================================================================== */
const KEY_MS = [97.5,95,90,85,80,75,70,65,60,55,50,45,40,35,30,20,12.5,5,2.5,1.3,0]; // 1 … 6 (Untergrenzen in %)
const KEY_OS = [95,90,85,80,75,70,65,60,55,50,45,40,33,27,20,0];                    // 15 … 0 Punkte
/* Feste Tabellen aus dem Vorschlag „Bewertung von Klassenarbeiten“ (Mindestprozent je Zwischennote; 1,5 = 1-2 usw.; 6+ gibt es dort nicht) */
const KEY_FIXED = {
  G: {label:'Vorschlag Gym 8–11', p:[96,92,87,83,78,74,69,64,59,55,50,46,41,36,31,26,21,16,11,null,0]},
  R: {label:'Vorschlag 5–7 / HS / RS', p:[96,91,86,82,77,72,67,62,57,53,48,43,38,33,28,23,18,12,6,null,0]}
};
const fmtNum = (v, d = 2) => v == null || isNaN(v) ? '–' : v.toFixed(d).replace('.', ',');
const parseNum = s => { const v = parseFloat(String(s).replace(',', '.')); return isNaN(v) ? null : v; };
const idxVal = (c, i) => isOS(c) ? 15 - i : 1 + i * 0.25;
function defaultKey(c){ return isOS(c) ? {mode:'C', a1:95, a4:45} : {mode:'A', a1:97.5, a4:40}; }
function keyPercents(c, key){
  const base = isOS(c) ? KEY_OS : KEY_MS, d = defaultKey(c), split = isOS(c) ? 10 : 12;
  if (key.mode !== 'B') return base.slice();
  const a1 = +key.a1, a4 = +key.a4;
  return base.map((p, i) => i <= split ? a4 + (p - d.a4) * (a1 - a4) / (d.a1 - d.a4) : p * a4 / d.a4);
}
/* Schlüssel berechnen: halbe Punkte, immer abrunden, dann „Glätten zugunsten der SuS“ (Grenzen nur senken) */
function computeKey(c, max, key){
  const F = !isOS(c) && KEY_FIXED[key.mode];
  if (F){                       // feste Tabelle: Grenzen auf halbe Punkte aufrunden („ab x %“), kein Glätten
    const T = F.p.map(p => p == null ? null : Math.ceil(p / 100 * max * 2 - 1e-9) / 2);
    for (let i = 1; i < T.length; i++) if (T[i] == null) T[i] = T[i-1];
    T[T.length-1] = 0;
    const cnt = i => ((i === 0 ? max + 0.5 : T[i-1]) - T[i]) / 0.5;
    const warn = []; for (let i = 0; i <= 12; i++) if (cnt(i) < 1) warn.push(i);
    return {T, exact:F.p.map(p => p == null ? null : p / 100 * max), cnt:T.map((_, i) => cnt(i)), warn, fixed:F, skip:F.p.map(p => p == null)};
  }
  const P = keyPercents(c, key), n = P.length, good = isOS(c) ? 11 : 12;
  const exact = P.map(p => p / 100 * max);
  const T = exact.map(x => Math.floor(x * 2 + 1e-9) / 2); T[n-1] = 0;
  const maxDev = 1.0;
  const cnt = i => ((i === 0 ? max + 0.5 : T[i-1]) - T[i]) / 0.5;
  for (let iter = 0; iter < 400; iter++){
    let ch = false;
    for (let i = 0; i < good; i++){
      const a = cnt(i), b = cnt(i+1);
      if (a - b > 1 && i >= 1 && T[i-1] - 0.5 >= exact[i-1] - maxDev && T[i-1] - 0.5 > T[i]){ T[i-1] -= 0.5; ch = true; }
      else if (b - a > 1 && T[i] - 0.5 >= exact[i] - maxDev && T[i] - 0.5 > T[i+1]){ T[i] -= 0.5; ch = true; }
    }
    if (!ch) break;
  }
  const warn = [];
  for (let i = 0; i <= good; i++) if (cnt(i) < 1) warn.push(i);
  return {T, exact, cnt: T.map((_, i) => cnt(i)), warn};
}
function gradeFromPts(c, K, pts){
  if (pts == null) return null;
  for (let i = 0; i < K.T.length; i++) if (pts >= K.T[i]) return idxVal(c, i);
  return idxVal(c, K.T.length - 1);
}
function examValue(c, ex, sid){
  const r = ex.res[sid]; if (!r) return null;
  if (ex.input === 'grade') return r.grade ?? null;
  if (r.nach && ex.nach){ return r.pts == null ? null : gradeFromPts(c, computeKey(c, ex.nach.max, ex.nach.key), r.pts); }
  return r.pts == null ? null : gradeFromPts(c, computeKey(c, ex.max, ex.key), r.pts);
}
const bucketOf = (c, v) => isOS(c) ? (v >= 13 ? 1 : v >= 10 ? 2 : v >= 7 ? 3 : v >= 4 ? 4 : v >= 1 ? 5 : 6) : Math.floor(v + 0.49);
const belowFour = (c, v) => isOS(c) ? v <= 3 : v >= 4.5;
function examStats(c, ex){
  const vals = activeStudents(c).map(s => examValue(c, ex, s.id)).filter(v => v != null);
  const sp = [0,0,0,0,0,0]; vals.forEach(v => sp[bucketOf(c, v) - 1]++);
  const below = vals.filter(v => belowFour(c, v)).length;
  return {n:vals.length, avg: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null, sp, below, third: vals.length && below > vals.length/3};
}
const examsOf = (c, range) => S.exams.filter(e => e.cid === c.id && inRange(e.date, range)).sort((a,b) => a.date.localeCompare(b.date) || a.title.localeCompare(b.title));
const gfsOf = (c, sid, range) => S.gfs.filter(g => g.cid === c.id && g.sid === sid && inRange(g.date, range));
function G(c){ return S.grades[c.id] || (S.grades[c.id] = {vals:{}, why:{}}); }
function gGet(c, key, sid){ const v = G(c).vals[key]; return v && v[sid] != null ? v[sid] : null; }
function gSet(c, key, sid, val){ const g = G(c); g.vals[key] = g.vals[key] || {}; if (val == null) delete g.vals[key][sid]; else g.vals[key][sid] = val; changed(); }
const wavg = list => { const w = list.reduce((a,x)=>a+x.w,0); return w ? list.reduce((a,x)=>a+x.v*x.w,0)/w : null; };

/* Berechnung für ein Halbjahr (hj 1/2) oder das Jahr (0) */
function calcStudent(c, sid, hj){
  const range = hjRange(hj);
  const sItems = [], mTests = [];
  for (const ex of examsOf(c, range)){
    const v = examValue(c, ex, sid); if (v == null) continue;
    const w = ex.weight ?? (ex.type === 'Test' ? 0.5 : 1);
    if (ex.type === 'Test' && ex.area === 'm') mTests.push({v, w}); else sItems.push({v, w});
  }
  for (const g of gfsOf(c, sid, range)) if (g.val != null) sItems.push({v:g.val, w:1});
  const sAvg = wavg(sItems);
  const secs = sections().filter(s => hj === 0 || s.hj === hj);
  const st = studentStats(c, sid, range), today = ymd(now());
  // laufende mündliche Note: festgelegte Abschnittsnoten, sonst Schätzung aus den Stunden (markiert)
  const secItems = [];
  for (const sec of secs){
    const set = gGet(c, sec.id, sid);
    if (set != null){ secItems.push({v:set, w:1, est:false}); continue; }
    if (sec.from > today) continue;
    const ss = studentStats(c, sid, sec), v = ss.rate ?? ss.comb;
    if (v != null) secItems.push({v, w:1, est:true});
  }
  const mRun = wavg([...secItems, ...mTests]) ?? st.rate ?? st.comb;
  const mRunEst = mRun != null && (secItems.some(x => x.est) || (!secItems.length && !mTests.length));
  const mSugg = mRun;
  const mKey = hj === 0 ? 'mJ' : 'm' + hj;
  let mSet = gGet(c, mKey, sid);
  if (hj === 0 && mSet == null){ const a = gGet(c,'m1',sid), b = gGet(c,'m2',sid); if (a != null && b != null) mSet = null; }
  const m = mSet ?? mSugg;
  const [ws, wm] = c.sm || [1,1];
  const vorschlag = sAvg != null && m != null ? (ws*sAvg + wm*m)/(ws+wm) : (sAvg ?? m);
  return {sAvg, sN:sItems.length, mSugg, mRun, mRunEst, mSet, m, vorschlag, st, secs};
}
function finalChoices(c, v){
  if (v == null) return [];
  if (isOS(c)) return [Math.floor(v), Math.ceil(v)].filter((x,i,a) => a.indexOf(x) === i);
  return [Math.floor(v), Math.ceil(v)].filter((x,i,a) => a.indexOf(x) === i).map(x => clamp(x,1,6));
}
function runChip(c, v, est){
  if (v == null) return '<span class="muted">–</span>';
  return est ? `<span class="gchip est" style="border-color:${valColor(c, v)}" title="nicht festgelegt / kommuniziert – geschätzt aus den Stundeneinschätzungen">≈ ${fmtVal(c, v)}</span>`
             : `<span class="gchip" style="background:${valColor(c, v)}">${fmtVal(c, v)}</span>`;
}
function hjNow(){ return ymd(now()) >= S.settings.hjSwitch ? 2 : 1; }
function isLowOral(c, sid){       // dezenter Hinweis im Sitzplan: mündlich 4- oder schlechter
  const r = calcStudent(c, sid, hjNow()); if (r.m == null) return false;
  return isOS(c) ? r.m < 4.5 : r.m >= 4.25 - 1e-9;
}
const fmtFinal = (c, v) => v == null ? '–' : isOS(c) ? `${v} P` : String(v);

/* ---------- Notenauswahl (Abschnitt / mündlich / Endnote) ---------- */
function notePicker(c, sid, key, title, whole, info, withWhy){
  const cur = gGet(c, key, sid), s = stu(c, sid);
  const opts = isOS(c) ? [...Array(16).keys()].reverse() : whole ? [1,2,3,4,5,6] : MS_LABELS.map((_, i) => 1 + i*0.25);
  const why = G(c).why[key + '|' + sid] || '';
  dialog(`<h2 style="margin-bottom:2px">${esc(title)}</h2><div class="muted">${esc(s.first)} ${esc(s.last)}</div>
    <div class="small" style="margin:8px 0">${info}</div>
    <div class="pick ${opts.length > 12 ? 'many' : ''}">${opts.map(v => `<button data-v="${v}" class="${cur === v ? 'on' : ''}" style="border-bottom:4px solid ${valColor(c, v)}">${whole && !isOS(c) ? v : fmtVal(c, v)}</button>`).join('')}</div>
    ${withWhy ? `<label class="small muted">Begründung / Notiz (optional)</label><input type="text" id="npWhy" value="${esc(why)}" style="width:100%">` : ''}`,
    [{t:'Entfernen', f:() => { gSet(c, key, sid, null); render(); }}, {t:'Abbrechen'}],
    d => $$('.pick button', d).forEach(b => b.onclick = () => {
      gSet(c, key, sid, +b.dataset.v);
      if (withWhy){ const w = $('#npWhy').value.trim(); if (w) G(c).why[key+'|'+sid] = w; else delete G(c).why[key+'|'+sid]; }
      closeDialog(); render(); }));
}

/* ---------- Ansicht „Noten“ ---------- */
function renderGrades(stage){
  const L = ui.ctx, c = course(L.cid);
  if (ui.examId){ const ex = S.exams.find(e => e.id === ui.examId); if (ex) return renderExam(stage, c, ex); ui.examId = null; }
  const tab = ui.gTab || (ymd(now()) >= S.settings.hjSwitch ? 'hj2' : 'hj1');
  const hj = tab === 'hj1' ? 1 : tab === 'hj2' ? 2 : 0;
  const mixed = isMixed(c), names = activeStudents(c).sort((a,b) => (a.last+a.first).localeCompare(b.last+b.first, 'de'));
  const range = hjRange(hj), exams = examsOf(c, range);
  const d = document.createElement('div'); d.className = 'listWrap';
  const tabs = [['hj1','1. Halbjahr'],['hj2','2. Halbjahr'], ...(isOS(c) ? [] : [['year','Jahr']])];
  d.innerHTML = `<div class="listHead"><b>${esc(c.name)} · Noten</b>
    <div class="seg small">${tabs.map(([k,l]) => `<button class="sm ${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <span class="small muted">s:m ${c.sm[0]}:${c.sm[1]}</span><span class="grow"></span>
    <button class="sm" data-new="KA">+ KA</button><button class="sm" data-new="Test">+ Test</button>${c.subject === 'nwt' ? '<button class="sm" data-new="Projekt">+ Projekt</button>' : ''}
    <button class="sm" id="gPrint">🖨 Bögen</button></div>
    ${(() => { const other = S.exams.filter(e => e.cid === c.id && !inRange(e.date, range)).length;
      return other && hj ? `<div class="small muted" style="margin:-4px 0 6px">+ ${other} Arbeit(en) im anderen Halbjahr (nach Datum) – Reiter wechseln.</div>` : ''; })()}
    <div class="listBody" id="gBody"></div>`;
  stage.appendChild(d);
  const body = $('#gBody', d), {rh, fs} = fitRows(body, names.length, 1, 30);
  const chip = (v, set, whole) => v == null ? '<span class="muted">–</span>'
    : `<span class="gchip ${set ? '' : 'sugg'}" style="${set ? `background:${valColor(c, v)}` : `border-color:${valColor(c, v)}`}">${whole ? fmtFinal(c, v) : fmtVal(c, v)}</span>`;
  let head, rowFn;
  if (hj){
    const secs = sections().filter(s => s.hj === hj);
    head = `<tr><th>Name</th>${mixed?'<th>Kl.</th>':''}${secs.map(s => `<th title="${esc(fmtDate(s.from))} – ${esc(fmtDate(s.to))}">mdl. ${s.label}<div class="th2">bis ${esc(fmtDate(s.to).slice(3))}</div></th>`).join('')}
      <th class="sep" title="laufend: festgelegte Abschnittsnoten, sonst ≈ Schätzung aus den Stunden">mündl. Ø<div class="th2">laufend</div></th><th>mündl. HJ<div class="th2">festgelegt</div></th>${exams.map(ex => `<th class="exh" data-ex="${ex.id}">${esc(ex.title)}<div class="th2">${esc(fmtDate(ex.date).slice(3))}${ex.type==='Test' && ex.area==='m' ? ' · m' : ''}</div></th>`).join('')}
      <th>GFS</th><th class="sep">schriftl. Ø</th><th>Vorschlag</th><th class="sep">Endnote</th></tr>`;
    rowFn = s => { const r = calcStudent(c, s.id, hj), e = gGet(c, 'e'+hj, s.id);
      const gf = gfsOf(c, s.id, range)[0];
      return `<tr data-sid="${s.id}"><td class="nmc"><b>${esc(s.last)}</b>, ${esc(s.first)} ${hintBadge(s)}</td>${mixed?`<td>${esc(s.cls||'')}</td>`:''}
        ${r.secs.map(sec => { const v = gGet(c, sec.id, s.id), sg = studentStats(c, s.id, sec); return `<td class="ed" data-k="${sec.id}">${v != null ? chip(v, true) : chip(sg.rate ?? sg.comb, false)}</td>`; }).join('')}
        <td class="sep">${runChip(c, r.mRun, r.mRunEst)}</td>
        <td class="ed" data-k="m${hj}">${r.mSet != null ? chip(r.mSet, true) : '<span class="muted small">setzen</span>'}</td>
        ${exams.map(ex => { const rr = ex.res[s.id]; const v = examValue(c, ex, s.id);
          return `<td class="exc" data-ex="${ex.id}">${rr && rr.miss && v == null ? '<span class="pill w">fehlt</span>' : chip(v, true)}</td>`; }).join('')}
        <td class="ed" data-gfs="1">${gf ? chip(gf.val, true) : '<span class="muted small">+</span>'}</td>
        <td class="sep">${r.sAvg == null ? '–' : `<b>${isOS(c) ? fmtNum(r.sAvg,1) + ' P' : fmtNum(r.sAvg)}</b> <span class="muted small">(${r.sN})</span>`}</td>
        <td>${r.vorschlag == null ? '–' : `${fmtNum(r.vorschlag)} <span class="muted">→ ${finalChoices(c, r.vorschlag).map(x => fmtFinal(c, x)).join(' / ')}</span>`}</td>
        <td class="ed sep" data-k="e${hj}">${e != null ? chip(e, true, true) : '<span class="muted small">setzen</span>'}${G(c).why['e'+hj+'|'+s.id] ? ' 💬' : ''}</td></tr>`; };
  } else {
    head = `<tr><th>Name</th>${mixed?'<th>Kl.</th>':''}<th>mündl. HJ1</th><th>mündl. HJ2</th><th class="sep">mündl. Jahr</th><th>schriftl. Ø (Jahr)</th><th>Vorschlag</th><th class="sep">Endnote HJ1</th><th class="sep">Jahresnote</th></tr>`;
    rowFn = s => { const r = calcStudent(c, s.id, 0), m1 = gGet(c,'m1',s.id), m2 = gGet(c,'m2',s.id), e = gGet(c,'eJ',s.id);
      const mJs = r.mSet ?? (m1 != null && m2 != null ? (m1+m2)/2 : null) ?? r.mSugg;
      const vor = r.sAvg != null && mJs != null ? (c.sm[0]*r.sAvg + c.sm[1]*mJs)/(c.sm[0]+c.sm[1]) : (r.sAvg ?? mJs);
      return `<tr data-sid="${s.id}"><td class="nmc"><b>${esc(s.last)}</b>, ${esc(s.first)} ${hintBadge(s)}</td>${mixed?`<td>${esc(s.cls||'')}</td>`:''}
        <td>${chip(m1, true)}</td><td>${chip(m2, true)}</td><td class="ed sep" data-k="mJ">${r.mSet != null ? chip(r.mSet, true) : chip(mJs, false)}</td>
        <td>${r.sAvg == null ? '–' : `<b>${fmtNum(r.sAvg)}</b>`}</td>
        <td>${vor == null ? '–' : `${fmtNum(vor)} <span class="muted">→ ${finalChoices(c, vor).map(x => fmtFinal(c, x)).join(' / ')}</span>`}</td>
        <td class="sep">${chip(gGet(c,'e1',s.id), true, true)}</td>
        <td class="ed sep" data-k="eJ">${e != null ? chip(e, true, true) : '<span class="muted small">setzen</span>'}</td></tr>`; };
  }
  body.innerHTML = names.length ? `<table class="list fit grades" style="--rh:${rh}px;font-size:${fs}px"><thead>${head}</thead><tbody>${names.map(rowFn).join('')}</tbody></table>
    <p class="small muted" style="margin:6px 2px">Gestrichelt = Vorschlag/Schätzung des Tools (≈ = noch nicht festgelegt), farbig gefüllt = von dir gesetzt. Zelle antippen zum Setzen. Spaltenkopf einer Arbeit antippen = bearbeiten.</p>`
    : '<p class="muted">Noch keine Schüler:innen.</p>';
  $$('[data-tab]', d).forEach(b => b.onclick = () => { ui.gTab = b.dataset.tab; render(); });
  $$('[data-new]', d).forEach(b => b.onclick = () => newExam(c, b.dataset.new));
  $('#gPrint', d).onclick = () => printSheets(c, names.map(s => s.id));
  $$('th[data-ex], td[data-ex]', d).forEach(el => el.onclick = () => { ui.examId = el.dataset.ex; render(); });
  $$('td.ed', d).forEach(td => td.onclick = () => {
    const sid = td.closest('tr').dataset.sid, k = td.dataset.k;
    if (td.dataset.gfs) return gfsDlg(c, sid, hj || 1);
    const st = studentStats(c, sid, hjRange(hj));
    const r = calcStudent(c, sid, hj);
    const info = `Nachbewertung <b>${fmtVal(c, st.rate)}</b> (${st.rateN}) · Tipps ${fmtVal(c, st.tap)} (${st.tapN}) · Beteiligung ${st.part == null ? '–' : PART_SHORT[Math.round(st.part)]} · Fehlstunden ${st.absentN}`;
    if (/^A\d+$/.test(k)){ const sec = sections().find(s => s.id === k); const ss = studentStats(c, sid, sec);
      return notePicker(c, sid, k, `Mündlich ${sec.label} (${fmtDate(sec.from)} – ${fmtDate(sec.to)})`, false,
        `Im Abschnitt: Nachbewertung <b>${fmtVal(c, ss.rate)}</b> (${ss.rateN}) · Tipps ${fmtVal(c, ss.tap)} (${ss.tapN}) · Beteiligung ${ss.part == null ? '–' : PART_SHORT[Math.round(ss.part)]} · Fehlstunden ${ss.absentN}`, false); }
    if (k[0] === 'm') return notePicker(c, sid, k, hj ? `Mündliche Note ${hj}. Halbjahr` : 'Mündliche Note Jahr', false, info + `<br>Vorschlag aus Abschnitten: <b>${fmtVal(c, r.mSugg)}</b>`, false);

function gfsDlg(c, sid, hj){
  const s = stu(c, sid), range = hjRange(hj);
  let g = gfsOf(c, sid, range)[0];
  const isNew = !g;
  if (!g) g = {id:uid(), cid:c.id, sid, date:ymd(now()), topic:'', val:null, notes:'', photos:[]};
  let photos = g.photos.slice();
  const opts = isOS(c) ? [...Array(16).keys()].reverse() : MS_LABELS.map((_, i) => 1 + i*0.25);
  const drawPhotos = () => { $('#gPh').innerHTML = photos.map((p, i) => `<div class="ph"><img src="${p}"><a href="#" data-pd="${i}">✕</a></div>`).join('') || '<span class="small muted">keine Fotos</span>';
    $$('[data-pd]').forEach(a => a.onclick = e => { e.preventDefault(); photos.splice(+a.dataset.pd, 1); drawPhotos(); }); };
  dialog(`<h2 style="margin-bottom:2px">GFS · ${esc(s.first)} ${esc(s.last)}</h2><p class="small muted">zählt wie eine Klassenarbeit (schriftlicher Bereich)</p>
    <div class="form"><label>Datum</label><input type="text" id="gDate" value="${esc(g.date)}"><label>Thema</label><input type="text" id="gTop" value="${esc(g.topic)}"></div>
    <label class="small muted">Note</label><select id="gVal" style="width:100%"><option value="">–</option>${opts.map(v => `<option value="${v}" ${g.val===v?'selected':''}>${fmtVal(c, v)}</option>`).join('')}</select>
    <label class="small muted">Bewertungsnotizen</label><textarea id="gNotes">${esc(g.notes)}</textarea>
    <div class="row" style="margin:6px 0"><button id="gAdd">📷 Foto/Protokoll hinzufügen</button><span class="small muted">max. 3, werden verkleinert & verschlüsselt</span></div>
    <input type="file" id="gFile" accept="image/*" capture="environment" class="hidden"><div id="gPh" class="phs"></div>`,
    [...(isNew ? [] : [{t:'GFS löschen', cls:'danger', f:() => { S.gfs = S.gfs.filter(x => x.id !== g.id); changed(); render(); }}]),
     {t:'Abbrechen'}, {t:'Speichern', cls:'pri', f:() => {
      g.date = $('#gDate').value.trim() || g.date; g.topic = $('#gTop').value.trim(); g.val = $('#gVal').value === '' ? null : +$('#gVal').value;
      g.notes = $('#gNotes').value.trim(); g.photos = photos;
      if (isNew) S.gfs.push(g); changed(); render(); }}],
    d => { drawPhotos();
      $('#gAdd').onclick = () => { if (photos.length >= 3) return toast('Maximal 3 Fotos.'); pickerOpen = true; $('#gFile').click(); };
      $('#gFile').onchange = async e => { pickerOpen = false; const f = e.target.files[0]; if (!f) return;
        try{ photos.push(await shrinkImage(f, 1600, 0.72)); drawPhotos(); }catch(err){ toast('Bild konnte nicht gelesen werden.'); } e.target.value = ''; };
    });
}
function shrinkImage(file, maxSide, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

<script>
'use strict';
/* =================== Kalender / Jahresplan =================== */
const T_TYPES = ['KA','Test','GFS','Sonstiges'];
function dayItems(c, date){

    const m = S.lessons[L.lk] || {};

  }

  for (const ex of S.exams.filter(e => e.cid === c.id && e.date === date)) items.push({k:'exam', ex});
  for (const ex of S.exams.filter(e => e.cid === c.id && e.nach && e.nach.date === date)) items.push({k:'nach', ex});
  for (const g of S.gfs.filter(g => g.cid === c.id && g.date === date)) items.push({k:'gfs', g});

function planDlg(c){

    <div class="row"><label>Plan beginnt am</label><input type="text" id="pFrom" value="${esc(c.planFrom || c.validFrom || '')}" style="width:120px">
      <span class="small muted">${all.length} Stunden bis Schuljahresende</span></div>
    <textarea id="pTxt" style="min-height:300px;font-family:Consolas,monospace;margin-top:8px" placeholder="# Mechanik&#10;Wiederholung Geschwindigkeit&#10;Beschleunigung – Versuch&#10;…">${esc(c.plan||'')}</textarea>
    <div class="small muted" id="pInfo"></div>`,
    [{t:'Abbrechen'}, {t:'Speichern', cls:'pri', f:() => { const f = $('#pFrom').value.trim(); if (f && !/^\d{4}-\d{2}-\d{2}$/.test(f)){ toast('Datum als JJJJ-MM-TT'); return false; }
      c.plan = $('#pTxt').value; c.planFrom = f || null; changed(); render(); toast('Jahresplan gespeichert.'); }}],
    dd => { const info = () => { const n = $('#pTxt').value.split('\n').filter(x => x.trim() && !x.trim().startsWith('#')).length;
      const last = all[Math.min(n, all.length) - 1];
      $('#pInfo').textContent = `${n} Themen · ${n > all.length ? (n - all.length) + ' passen nicht mehr ins Schuljahr' : (all.length - n) + ' Stunden ohne Thema'}${last ? ' · letztes Thema am ' + fmtDate(last.date) : ''}`; };
      $('#pTxt').oninput = info; info(); });
}
function terminDlg(c, t, date){
  const isNew = !t; t = t || {id:uid(), cid:c.id, date, type:'KA', title:''};
  dialog(`<h2>${isNew ? 'Termin planen' : 'Termin'} · ${esc(c.name)}</h2>
    <div class="form"><label>Art</label><select id="tType">${T_TYPES.map(x => `<option ${x===t.type?'selected':''}>${x}</option>`).join('')}</select>
    <label>Datum</label><input type="text" id="tDate" value="${esc(t.date)}" placeholder="JJJJ-MM-TT">
    <label>Titel</label><input type="text" id="tTitle" value="${esc(t.title)}" placeholder="z. B. KA 1 Mechanik"></div>
    <p class="small muted">Erscheint im Kalender und auf der Startseite (ab 7 Tage vorher).</p>`,
    [...(isNew ? [] : [{t:'Löschen', cls:'danger', f:() => { S.termine = S.termine.filter(x => x.id !== t.id); changed(); render(); }},
       ...(['KA','Test'].includes(t.type) ? [{t:'→ Arbeit anlegen', f:() => { S.termine = S.termine.filter(x => x.id !== t.id); newExam(c, t.type);
          const ex = S.exams[S.exams.length-1]; ex.date = t.date; if (t.title) ex.title = t.title; ui.mode = 'grades'; changed(); render(); }}] : [])]),
     {t:'Abbrechen'}, {t:'Speichern', cls:'pri', f:() => {
      const dt = $('#tDate').value.trim(); if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)){ toast('Datum als JJJJ-MM-TT'); return false; }
      t.type = $('#tType').value; t.date = dt; t.title = $('#tTitle').value.trim();
      if (isNew) S.termine.push(t); changed(); render(); }}]);
}

/* =================== Rückmeldebogen (Druck) =================== */
function printSheets(c, sids){
  const hj = ymd(now()) >= S.settings.hjSwitch ? 2 : 1, range = hjRange(0);
  const secs = sections();
  const sheet = sid => {
    const s = stu(c, sid), st = studentStats(c, sid, range);
    const exams = examsOf(c, range).map(ex => ({ex, v:examValue(c, ex, sid)})).filter(x => x.v != null);
    const gf = gfsOf(c, sid, range);
    const partDist = [0,1,2,3].map(l => S.part.filter(p => p.cid === c.id && p.sid === sid && p.level === l).length);
    return `<div class="sheet"><div class="shHead"><div><div class="shT">Rückmeldung zur Leistung</div><div>${esc(s.first)} ${esc(s.last)} · ${esc(c.name)}</div></div>
      <div class="shR">Stand ${esc(fmtDate(ymd(now())))}${now().getFullYear()}<br>${hj}. Halbjahr</div></div>
      <h3>Mündliche Mitarbeit</h3>
      <table class="shTab"><tr><th>Abschnitt</th><th>Zeitraum</th><th>Note</th></tr>${secs.filter(x => x.from <= ymd(now())).map(x => { const v = gGet(c, x.id, sid), t = studentStats(c, sid, x);
        return `<tr><td>${x.label}</td><td>${esc(fmtDate(x.from))} – ${esc(fmtDate(x.to))}</td><td>${v != null ? `<b>${fmtVal(c, v)}</b>` : `Tendenz ${fmtVal(c, t.rate ?? t.comb)}`}</td></tr>`; }).join('')}</table>
      <div class="shL">Verlauf der Stunden (älteste links):</div><div class="dots big">${st.history.slice(-40).map(h => `<span class="dot" style="background:${valColor(c, h.v)}"></span>`).join('') || '–'}</div>
      <div class="legend"><span class="dot" style="background:${valColor(c, isOS(c)?14:1.25)}"></span> stark <span class="dot" style="background:${valColor(c, isOS(c)?8:3)}"></span> mittel <span class="dot" style="background:${valColor(c, isOS(c)?2:5)}"></span> schwach</div>
      <div class="shL">Beteiligung (Anzahl Stunden): viel ${partDist[3]} · mittel ${partDist[2]} · wenig ${partDist[1]} · nicht gemeldet ${st.noneTotal}${st.absentN ? ` · Fehlstunden ${st.absentN}` : ''}</div>
      <h3>Schriftliche Leistungen</h3>
      ${exams.length || gf.length ? `<table class="shTab"><tr><th>Arbeit</th><th>Datum</th><th>Note</th></tr>${exams.map(x => `<tr><td>${esc(x.ex.title)}</td><td>${esc(fmtDate(x.ex.date))}</td><td><b>${fmtVal(c, x.v)}</b></td></tr>`).join('')}
        ${gf.map(g => `<tr><td>GFS${g.topic ? ': ' + esc(g.topic) : ''}</td><td>${esc(fmtDate(g.date))}</td><td><b>${fmtVal(c, g.val)}</b></td></tr>`).join('')}</table>` : '<p>Noch keine Ergebnisse.</p>'}
      <h3>Ziele & Vereinbarungen</h3><div class="lines">${'<div></div>'.repeat(6)}</div>
      <div class="sign"><span>Datum</span><span>Lehrkraft</span><span>Schüler:in</span></div></div>`;
  };
  let pr = $('#print'); if (!pr){ pr = document.createElement('div'); pr.id = 'print'; document.body.appendChild(pr); }
  pr.innerHTML = sids.map(sheet).join('');
  pickerOpen = true; setTimeout(() => { window.print(); pickerOpen = false; }, 50);
}
</script>
<script>
'use strict';
/* =================== Startseite =================== */
function nextLessonOfCourse(c){
  let d = ymd(now());
  for (let i = 0; i < 60; i++){ const L = lessonsOn(d).find(x => x.cid === c.id); if (L) return L; d = addDays(d, 1); }
  return null;
}
function openCourse(c){
  const L = pastLessonsOfCourse(c, 1)[0] || nextLessonOfCourse(c);
  if (!L) return toast('Für diesen Kurs ist kein Termin eingetragen (Einstellungen → Stundenplan).');
  openLesson(L, 'live');
}
function weekStart(off){ const d = now(); d.setDate(d.getDate() - ((d.getDay()+6)%7) + 7*off); return ymd(d); }
function upcomingItems(days){
  const today = ymd(now()), end = addDays(today, days), out = [];
  for (const t of S.termine) if (t.date >= today && t.date <= end && course(t.cid)) out.push({date:t.date, txt:`${t.type}: ${t.title || ''}`, c:course(t.cid)});
  for (const ex of S.exams){ const c = course(ex.cid); if (!c) continue;
    if (ex.date >= today && ex.date <= end) out.push({date:ex.date, txt:ex.title, c});
    if (ex.nach && ex.nach.date >= today && ex.nach.date <= end) out.push({date:ex.nach.date, txt:'Nachtermin ' + ex.title, c}); }
  return out.sort((a,b) => a.date.localeCompare(b.date));
}
function dueItems(){
  const today = ymd(now()), out = [];
  for (const s of sections()) if (s.to >= addDays(today, -7) && s.to <= addDays(today, 10)) out.push(`Mündliche Noten ${s.label} (bis ${fmtDate(s.to)}) setzen`);
  for (const ex of S.exams){ const c = course(ex.cid); if (!c) continue;
    const open = activeStudents(c).filter(st => ex.res[st.id]?.miss && examValue(c, ex, st.id) == null);
    if (open.length) out.push(`${c.name} · ${ex.title}: ${open.length} Nachschreiber offen`); }
  for (const c of S.courses) for (const s of activeStudents(c)){ const n = smollyCount(c, s.id);
    if (n >= S.settings.smollyMax) out.push(`⚡ Nachsitzen fällig: ${s.first} ${s.last} (${c.name}, ${n} Smollys)`); }
  return out;
}
function homeLessonClick(L, n){ openLesson(L, (L.date < n.date || (L.date === n.date && L.end <= n.t)) ? 'rate' : 'live'); }
function renderHome(stage){
  const n = nowInfo(), view = S.settings.homeView || 'week';
  const d = document.createElement('div'); d.className = 'scroll homeWrap';
  const off = ui.weekOff || 0, ws = weekStart(off), days = [0,1,2,3,4].map(i => addDays(ws, i));
  const status = L => {
    const rated = S.ratings.filter(r => r.lk === L.lk).length, evN = S.events.filter(e => e.lk === L.lk).length;
    const past = L.date < n.date || (L.date === n.date && L.end <= n.t), nowRun = L.date === n.date && L.start <= n.t && n.t < L.end;
    const ent = lessonEntered(L.lk), cancel = (S.lessons[L.lk]||{}).cancel;
    return {rated, evN, past, nowRun, ent, cancel, cls: cancel ? 'cancel' : ent ? 'done' : past ? 'miss' : '',
      pill: cancel ? '<span class="pill">entfällt</span>' : nowRun ? '<span class="pill a">läuft</span>' : ent ? `<span class="pill g">✓ eingetragen${rated ? ' · ' + rated + ' bew.' : ''}</span>` : past ? '<span class="pill">nicht eingetragen</span>' : ''};
  };
  let main = '';
  if (view === 'week'){
    const used = Math.max(6, ...S.courses.flatMap(c => c.schedule.map(e => e.to)));
    const slots = S.settings.slots.slice(0, used);
    let cells = `<div class="wkH"></div>` + days.map(dt => { const hol = holidayOf(dt), tm = upcomingItems(400).filter(x => x.date === dt);
      return `<div class="wkH ${dt===n.date?'today':''}">${esc(fmtDate(dt))}${hol ? `<div class="small muted">${esc(hol.label)}</div>` : ''}${tm.map(x => `<div class="wkT">${esc(x.c.name)}: ${esc(x.txt)}</div>`).join('')}</div>`; }).join('');
    slots.forEach((sl, i) => { cells += `<div class="wkS" style="grid-row:${i+2}"><b>${i+1}.</b><br><span class="small muted">${sl[0]}</span></div>`; });
    days.forEach((dt, di) => {
      const hol = holidayOf(dt);
      if (hol){ cells += `<div class="wkHol" style="grid-column:${di+2};grid-row:2 / ${used+2}">🌴 ${esc(hol.label)}</div>`; return; }
      for (const L of lessonsOn(dt)){ if (L.from > used) continue;
        const c = course(L.cid), st = status(L), tp = topicOf(L);
        cells += `<div class="wkL ${st.nowRun?'now':''} ${st.past?'past':''} ${st.cls}" data-lk="${esc(L.lk)}" style="--cc:${c.color||'#9ca3af'};grid-column:${di+2};grid-row:${L.from+1} / ${Math.min(L.to, used)+2}">
          ${tp && !st.cancel ? `<button class="cpy" data-cp="${esc(tp)}" title="Thema kopieren">📋</button>` : ''}<b>${esc(c.name)}</b> <span class="small muted">R${esc(L.room)}</span>${tp ? `<div class="small tpc">${esc(tp)}</div>` : ''}<div>${st.pill}</div></div>`; }
    });
    main = `<div class="wk" style="grid-template-rows:auto repeat(${used}, minmax(46px, 1fr))">${cells}</div>`;
  } else {
    const dt = addDays(n.date, ui.dayOff || 0), hol = holidayOf(dt), L = lessonsOn(dt);
    main = `<div class="row" style="margin-bottom:8px"><button class="sm" id="hDPrev">◀</button><b>${esc(fmtDate(dt))}</b><button class="sm" id="hDNext">▶</button><button class="sm" id="hDToday">Heute</button></div>
      ${hol ? `<p>🌴 ${esc(hol.label)}</p>` : L.length ? L.map(x => { const c = course(x.cid), st = status(x), tp = topicOf(x);
        return `<div class="lessonCard ${st.nowRun?'now':''} ${st.past?'past':''} ${st.cls}" data-lk="${esc(x.lk)}" style="border-left:6px solid ${c.color||'#9ca3af'}"><div class="t">${min2hm(x.start)}–${min2hm(x.end)}</div>
        <div style="flex:1"><b>${esc(c.name)}</b> <span class="muted small">R${esc(x.room)} · ${x.from===x.to?x.from+'.':x.from+'./'+x.to+'.'} Std</span>${activeStudents(c).length ? '' : ' <span class="pill w">keine Namen</span>'}
          ${tp ? `<div class="small">${esc(tp)}</div>` : ''}</div>
        ${tp && !st.cancel ? `<button class="sm" data-cp="${esc(tp)}">📋 Thema</button>` : ''} ${st.pill}</div>`; }).join('') : '<p class="muted">Kein Unterricht eingetragen.</p>'}`;
  }
  const up = upcomingItems(14), due = dueItems();
  d.innerHTML = `<div class="card"><div class="row" style="margin-bottom:10px">
      <div class="seg">${[['week','Woche'],['day','Tag']].map(([k,l]) => `<button class="sm ${view===k?'on':''}" data-hv="${k}">${l}</button>`).join('')}</div>
      ${view === 'week' ? `<button class="sm" id="hPrev">◀</button><b>${esc(fmtDate(days[0]))} – ${esc(fmtDate(days[4]))}</b><button class="sm" id="hNext">▶</button><button class="sm" id="hNow">Diese Woche</button>` : ''}
      <span class="grow"></span><span class="small muted">Stunde antippen = öffnen</span></div>${main}</div>
    ${due.length || up.length ? `<div class="card"><div class="row" style="align-items:flex-start;gap:30px">
      ${due.length ? `<div><h3 style="margin-top:0">⏰ Fällig</h3>${due.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : ''}
      ${up.length ? `<div><h3 style="margin-top:0">Nächste Termine (14 Tage)</h3>${up.map(x => `<div><b>${esc(fmtDate(x.date))}</b> ${esc(x.c.name)} · ${esc(x.txt)}</div>`).join('')}</div>` : ''}</div></div>` : ''}
    ${S.courses.length ? '' : `<div class="card" style="border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)"><h2 style="margin-top:0">Willkommen 👋</h2>
      <p>1. <b>Stundenraster & Ferien</b> deiner Schule prüfen (vorbelegt: übliches Raster, amtliche Ferien BW 2026/27).</p>
      <div class="row"><button id="hWSet">Stundenraster & Ferien öffnen</button></div>
      <p style="margin-top:12px">2. <b>Kurs anlegen</b> – Name, Stufe, Gewichtung, Wochentage/Stunden und Raum. Danach Namen aus Excel einfügen oder Demo-Namen zum Ausprobieren.</p>
      <div class="row"><button class="pri" id="hWCourse">+ Ersten Kurs anlegen</button></div></div>`}
    <div class="card"><h3 style="margin-top:0">Kurse</h3><div class="courseGrid">
      ${S.courses.map(c => `<button data-cid="${c.id}" style="border-left:7px solid ${c.color||'#9ca3af'}">${esc(c.name)}<br><span class="small muted">${activeStudents(c).length} SuS · ${c.level==='OS'?'Oberstufe':'Mittelstufe'}</span></button>`).join('')}
      <button id="hAddC" style="border-style:dashed;color:var(--acc)">+ Kurs anlegen</button>
    </div></div>
    <div class="card small muted">🔒 Daten verschlüsselt (AES-256) · ${FH ? 'mit Datei verknüpft' : 'nur auf diesem Gerät gespeichert'} · Sicherung & Datei unter ⚙ Einstellungen.</div>`;
  stage.appendChild(d);
  const allL = lk => { const dt = lk.split('|')[1]; return lessonsOn(dt).find(x => x.lk === lk); };
  $$('[data-lk]', d).forEach(el => el.onclick = e => { if (e.target.closest('[data-cp]')) return; const L = allL(el.dataset.lk); if (L) homeLessonClick(L, n); });
  $$('[data-cp]', d).forEach(b => b.onclick = e => { e.stopPropagation(); copyText(b.dataset.cp); });
  $$('[data-cid]', d).forEach(b => b.onclick = () => openCourse(course(b.dataset.cid)));
  { const w = $('#hWCourse', d); if (w) d.prepend(w.closest('.card')); }
  if ($('#hAddC', d)) $('#hAddC', d).onclick = courseWizard;
  if ($('#hWCourse', d)) $('#hWCourse', d).onclick = courseWizard;
  if ($('#hWSet', d)) $('#hWSet', d).onclick = () => { ui.view = 'settings'; render(); setTimeout(() => { const el = $('#oSlots'); if (el) el.scrollIntoView({block:'center'}); }, 50); };
  $$('[data-hv]', d).forEach(b => b.onclick = () => { S.settings.homeView = b.dataset.hv; changed(); render(); });
  const on = (id, f) => { const el = $('#'+id, d); if (el) el.onclick = f; };
  on('hPrev', () => { ui.weekOff = off - 1; render(); }); on('hNext', () => { ui.weekOff = off + 1; render(); }); on('hNow', () => { ui.weekOff = 0; render(); });
  on('hDPrev', () => { ui.dayOff = (ui.dayOff||0) - 1; render(); }); on('hDNext', () => { ui.dayOff = (ui.dayOff||0) + 1; render(); }); on('hDToday', () => { ui.dayOff = 0; render(); });
}

/* =================== Farbauswahl =================== */
function colorPicker(cur){
  return `<div class="cpick">${COLOR_FAMILIES.map(([n, cols]) => `<div class="cfam"><span class="small muted">${n}</span>${cols.map(col =>
    `<button class="csw ${col === cur ? 'on' : ''}" data-col="${col}" style="background:${col}" title="${n}"></button>`).join('')}</div>`).join('')}</div>`;
}
function bindColorPicker(root, cb){ $$('.csw', root).forEach(b => b.onclick = e => { e.preventDefault(); $$('.csw', root).forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset.col); }); }

/* =================== Kurs-Assistent =================== */
function courseWizard(){
  const rooms = Object.keys(S.rooms).sort();
  const slotOpt = sel => S.settings.slots.map((x,i) => `<option value="${i+1}" ${i+1===sel?'selected':''}>${i+1}. (${x[0]})</option>`).join('');
  const rowHtml = (i) => `<div class="row wzRow" style="margin-top:6px">
      <select class="wDay">${[[1,'Mo'],[2,'Di'],[3,'Mi'],[4,'Do'],[5,'Fr']].map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}</select>
      <select class="wFrom">${slotOpt(1)}</select><span>bis</span><select class="wTo">${slotOpt(2)}</select>
      <input type="text" class="wRoom" placeholder="Raum" value="${esc(rooms[0]||'')}" style="width:80px" list="wRooms"></div>`;
  dialog(`<h2>Kurs anlegen</h2>
    <div class="form"><label>Name</label><input type="text" id="wName" placeholder="z. B. 7b Deutsch">
      <label>Klasse</label><input type="text" id="wCls" placeholder="z. B. 7b">
      <label>Stufe</label><select id="wLvl"><option value="MS">Klasse 5–10 (Noten 1–6)</option><option value="OS">Oberstufe (0–15 Punkte)</option></select>
      <label>Gewichtung</label><div class="row" style="flex-wrap:nowrap">schriftl. <input type="number" id="wS" value="1" style="width:60px"> : mündl. <input type="number" id="wM" value="1" style="width:60px"></div></div>
    <h3>Unterrichtsstunden pro Woche</h3><p class="small muted">Doppelstunde = von/bis. Raum: Nummer oder Name (neue Räume werden angelegt).</p>
    <datalist id="wRooms">${rooms.map(r => `<option value="${esc(r)}">`).join('')}</datalist>
    <div id="wRows">${rowHtml(0)}</div><button class="sm" id="wAddRow" style="margin-top:6px">+ weitere Stunde</button>
    <h3>Farbe</h3>${colorPicker(null)}
    <h3>Sitzordnung für neue Räume</h3>
    <select id="wTpl" style="width:100%"><option value="std">8 Bänke à 4 Plätze (2 Reihen)</option><option value="u">U-Form (Seiten 6 · hinten 4 · 6)</option><option value="empty">leer – Tische selbst setzen</option></select>`,
    [{t:'Abbrechen'}, {t:'Anlegen', cls:'pri', f:() => {
      const name = $('#wName').value.trim(); if (!name){ toast('Bitte einen Namen eingeben.'); return false; }
      const sched = [];
      for (const r of $$('.wzRow')){
        const room = $('.wRoom', r).value.trim() || 'Raum'; const from = +$('.wFrom', r).value, to = Math.max(from, +$('.wTo', r).value);
        if (!S.rooms[room]){ const tpl = $('#wTpl').value;
          S.rooms[room] = tpl === 'u' ? uRoom(room, 6, 4, 6) : tpl === 'empty' ? {id:room, name:'Raum ' + room, tables:[], board:{x:500, y:700, w:390, h:54}} : standardRoom(room); }
        sched.push([+$('.wDay', r).value, from, to, room]);
      }
      const lvl = $('#wLvl').value, c = mkCourse(name, 'sonst', lvl, $('#wCls').value.trim(), sched);
      c.color = ui.wzColor || autoColor(S, c);
      c.sm = [Math.max(0, +$('#wS').value || 1), Math.max(0, +$('#wM').value || 1)]; c.validFrom = ymd(now());
      S.courses.push(c); changed(); toast('Kurs angelegt – jetzt Namen einfügen.');
      const L = pastLessonsOfCourse(c, 1)[0] || nextLessonOfCourse(c);
      if (L){ openLesson(L, 'edit'); setTimeout(() => importDlg(c), 80); } else render();
    }}],
    d => { ui.wzColor = null; bindColorPicker(d, col => { ui.wzColor = col; });
      $('#wAddRow').onclick = () => $('#wRows').insertAdjacentHTML('beforeend', rowHtml(1)); setTimeout(() => $('#wName').focus(), 30); });
}

/* =================== Einstellungen =================== */
const DAYS = [[1,'Mo'],[2,'Di'],[3,'Mi'],[4,'Do'],[5,'Fr']];
function renderSettings(stage){
  const d = document.createElement('div'); d.className = 'scroll';
  const fsa = typeof window.showSaveFilePicker === 'function';
  const rooms = Object.keys(S.rooms).sort();
  const slotOpts = sel => S.settings.slots.map((s,i) => `<option value="${i+1}" ${i+1===sel?'selected':''}>${i+1}.</option>`).join('');
  d.innerHTML = `<div style="max-width:900px">
  <div class="card"><h2 style="margin-top:0">Sicherheit</h2>
    <label class="cb"><input type="checkbox" id="oDay" ${S.settings.rememberDay?'checked':''}> Passwort nur einmal pro Tag (bis Mitternacht entsperrt, auch nach Neustart des Browsers)</label>
    <p class="small muted" style="margin:0 0 0 26px">Während des Tages kann jede Person mit Zugang zu deinem Windows-Konto das Tool öffnen. Daher: Surface immer mit Windows-Sperre (PIN / Windows Hello) sichern.</p>
    <label class="cb"><input type="checkbox" id="oCover" ${S.settings.cover?'checked':''}> Abdeckung, sobald ich zu einer anderen App wechsle (Beamer-Schutz)</label>
    <div class="row" style="margin-top:8px"><button id="oPw">Passwort ändern</button><button id="oLock">Jetzt sperren</button></div></div>

  <div class="card"><h2 style="margin-top:0">Datendatei & Sicherung</h2>
    <p class="small">Status: <b>${FH ? (fileState==='ok' ? 'mit Datei verknüpft ✓' : 'Datei verknüpft – '+fileState) : 'nur in diesem Browser gespeichert'}</b></p>
    ${LITE ? `<p class="small muted">Die Daten liegen verschlüsselt nur in diesem Browser. Lade regelmäßig eine Sicherung herunter (am iPad: in „Dateien“ ablegen).
      „Sicherung importieren“ stellt alles wieder her – auch auf einem anderen Gerät.</p>` : `<p class="small muted">Die Datei enthält nur verschlüsselte Daten. Für Surface + Heim-PC: hier eine Datei anlegen (z. B. im OneDrive-Ordner – nur nach Absprache mit Schulleitung/DSB),
    am anderen Gerät bei der Einrichtung „Vorhandene Datendatei öffnen“ wählen.</p>`}
    <div class="row">${fsa && !LITE ? `<button id="oNew">Neue Datei anlegen & verknüpfen</button><button id="oOpen">Vorhandene Datei verknüpfen</button>` : LITE ? '' : '<span class="small muted">Datei-Verknüpfung in diesem Browser nicht verfügbar – bitte Edge oder Chrome nutzen.</span>'}
      ${FH ? '<button id="oUnlink">Verknüpfung lösen</button>' : ''}</div>
    <div class="row" style="margin-top:8px"><button id="oExp">Sicherung herunterladen</button><button id="oImp">Sicherung importieren</button></div>
    <h3>Automatische Freitags-Sicherung</h3>
    <label class="cb"><input type="checkbox" id="oAuto" ${S.settings.autoBackup?'checked':''}> ${LITE ? 'jeden Freitag an die Sicherung erinnern' : 'jeden Freitag nach der letzten Stunde eine Sicherung mit Datum anlegen'}</label>
    <p class="small">Sicherungsordner: <b>${BAKDIR ? esc(BAKDIR.name) : (FSA ? 'noch keiner gewählt' : 'Download-Ordner (dieser Browser kann keinen Ordner wählen)')}</b>
      · letzte Sicherung: <b>${S.settings.lastAutoBackup ? esc(fmtDate(S.settings.lastAutoBackup)) + S.settings.lastAutoBackup.slice(0,4) : '–'}</b></p>
    <div class="row">${FSA ? '<button id="oBakDir">Sicherungsordner wählen …</button>' : ''}<button id="oBakNow">Jetzt sichern</button></div></div>

  <div class="card"><h2 style="margin-top:0">Kurse & Stundenplan</h2>
    <p class="small muted">Gilt ab: Datum je Kurs. Doppelstunde = von/bis. s:m = Gewichtung schriftlich : mündlich (für die Notenberechnung in Version 2).</p>
    ${S.courses.map(c => `<div class="card" data-cid="${c.id}" style="background:#fafbfc">
      <div class="row"><span class="cdotT big" style="background:${c.color||'#9ca3af'}"></span><input type="text" data-f="name" value="${esc(c.name)}" style="width:150px">
        <select data-f="level"><option value="MS" ${c.level==='MS'?'selected':''}>Mittelstufe</option><option value="OS" ${c.level==='OS'?'selected':''}>Oberstufe</option></select>
        <label>Klasse</label><input type="text" data-f="cls" value="${esc(c.cls||'')}" style="width:80px">
        <label>s:m</label><input type="number" data-f="sm0" value="${c.sm[0]}" style="width:56px">:<input type="number" data-f="sm1" value="${c.sm[1]}" style="width:56px">
        <label>ab</label><input type="text" data-f="validFrom" value="${esc(c.validFrom||'')}" style="width:110px" placeholder="JJJJ-MM-TT">
        <button class="danger" data-delc="1">Kurs löschen</button></div>
      ${c.schedule.map((e,i) => `<div class="row" style="margin-top:6px" data-si="${i}">
        <select data-s="day">${DAYS.map(([v,l])=>`<option value="${v}" ${v===e.day?'selected':''}>${l}</option>`).join('')}</select>
        <select data-s="from">${slotOpts(e.from)}</select>–<select data-s="to">${slotOpts(e.to)}</select>
        <label>Raum</label><select data-s="room">${rooms.map(r=>`<option ${r===e.room?'selected':''}>${esc(r)}</option>`).join('')}</select>
        <button data-dels="${i}">✕</button></div>`).join('')}
      <button data-adds="1" style="margin-top:6px">+ Termin</button></div>`).join('')}
    <button id="oAddC">+ Kurs</button></div>

  <div class="card"><h2 style="margin-top:0">Räume</h2>
    ${rooms.map(r => `<div class="row" style="margin-bottom:6px"><b style="width:60px">${esc(r)}</b><span class="small muted" style="width:220px">${S.rooms[r].tables.length} Tische · ${seatsOf(S.rooms[r]).length} Plätze${S.rooms[r].needsSetup?' · Vorlage':''}</span>
      <button data-er="${esc(r)}">Bearbeiten</button><button class="danger" data-dr="${esc(r)}">Löschen</button></div>`).join('')}
    <div class="row"><input type="text" id="oRoomId" placeholder="Raumnummer" style="width:120px"><button id="oAddR">+ Raum</button></div></div>

  <div class="card"><h2 style="margin-top:0">Stundenraster</h2>
    <textarea id="oSlots" style="min-height:200px;font-family:Consolas,monospace">${S.settings.slots.map((s,i)=>`${i+1}. ${s[0]}-${s[1]}`).join('\n')}</textarea>
    <button id="oSlotsOk">Übernehmen</button></div>

  <div class="card"><h2 style="margin-top:0">Ferien & freie Tage 2026/27</h2>
    <p class="small muted">Eine Zeile pro Zeitraum: <span class="kbd">JJJJ-MM-TT JJJJ-MM-TT Bezeichnung</span>. Vorbelegt: Ferien und Feiertage Baden-Württemberg.
    <b>Bitte die beweglichen Ferientage und Fasnet deiner Schule ergänzen.</b></p>
    <textarea id="oHol" style="min-height:180px;font-family:Consolas,monospace">${S.settings.holidays.map(h=>`${h.from} ${h.to} ${h.label}`).join('\n')}</textarea>
    <button id="oHolOk">Übernehmen</button></div>

  <div class="card"><h2 style="margin-top:0">Schuljahr & mündliche Abschnitte</h2>
    <div class="row"><label>Erfassung ab</label><input type="text" id="oYS" value="${esc(S.settings.yearStart)}" style="width:110px">
      <label>2. Halbjahr ab</label><input type="text" id="oHJ" value="${esc(S.settings.hjSwitch)}" style="width:110px">
      <label>Schuljahresende</label><input type="text" id="oYE" value="${esc(S.settings.yearEnd)}" style="width:110px"></div>
    <p class="small muted">Abschnitte entstehen automatisch an den Ferien; kürzer als ${S.settings.minSection} Tage → mit dem Nachbarn zusammengelegt. Aktuell:
      ${sections().map(x => `<b>${x.label}</b> ${esc(fmtDate(x.from))}–${esc(fmtDate(x.to))}`).join(' · ')}</p>
    <label class="small muted">Eigene Abschnitte (optional, überschreibt die Automatik; eine Zeile: JJJJ-MM-TT JJJJ-MM-TT)</label>
    <textarea id="oSec" style="min-height:70px;font-family:Consolas,monospace">${esc(S.settings.sectionsCustom||'')}</textarea><button id="oSecOk">Übernehmen</button></div>

  <div class="card"><h2 style="margin-top:0">Nachbewertung</h2>
    <div class="row"><label>Vorschläge pro Stunde</label><input type="number" id="oN" value="${S.settings.suggestN}" min="1" max="40" style="width:70px"></div>
    <div class="row" style="margin-top:8px"><label>⚡ Nachsitzen ab</label><input type="number" id="oSmo" value="${S.settings.smollyMax}" min="1" max="20" style="width:70px"><span class="small muted">Smollys</span></div></div>

  <div class="card"><h2 style="margin-top:0">Testen</h2>
    <p class="small muted">Uhrzeit simulieren, um den Ablauf (Stundenbeginn, Stundenende, Nachbewertung) außerhalb der Schulzeit auszuprobieren. Gilt nur bis zum Schließen.</p>
    <div class="row"><input type="datetime-local" id="oSim" value="${(()=>{const t=now();return `${ymd(t)}T${pad(t.getHours())}:${pad(t.getMinutes())}`})()}"><button id="oSimOk">Setzen</button><button id="oSimOff">Echte Uhrzeit</button></div>
    <div class="row" style="margin-top:8px"><button id="oDemo">Demo-Namen in alle leeren Kurse</button><button class="danger" id="oDemoDel">Alle Demo-Namen + deren Einträge löschen</button></div></div>
  <p class="small muted">Lehrertool ${APP_VERSION} · läuft offline · technisch gesperrt für Netzwerkzugriffe (Content-Security-Policy) · AES-256-GCM, PBKDF2 600 000 Runden.</p>
  </div>`;
  stage.appendChild(d);
  const on = (id, f) => { const el = $('#'+id, d); if (el) el.onclick = f; };
  $('#oDay', d).onchange = async e => { S.settings.rememberDay = e.target.checked; if (S.settings.rememberDay) await storeDayKey(); else await kvDel('daykey'); changed(); };
  $('#oCover', d).onchange = e => { S.settings.cover = e.target.checked; changed(); };
  on('oPw', changePassword); on('oLock', lockNow);
  on('oNew', linkNewFile); on('oOpen', () => linkExistingFile(false)); on('oUnlink', unlinkFile);
  on('oExp', exportBackup); on('oImp', () => importBackup(false));
  $('#oAuto', d).onchange = e => { S.settings.autoBackup = e.target.checked; changed(); };
  on('oBakDir', chooseBackupDir);
  on('oBakNow', async () => { if (BAKDIR){ const p = await BAKDIR.requestPermission({mode:'readwrite'}).catch(() => 'denied'); if (p === 'granted') await doBackup(false); } else await exportBackup(); render(); });
  // Kurse
  $$('[data-cid]', d).forEach(card => {
    const c = course(card.dataset.cid);
    $$('[data-f]', card).forEach(inp => inp.onchange = () => {
      const f = inp.dataset.f, v = inp.value.trim();
      if (f === 'sm0') c.sm[0] = +v || 1; else if (f === 'sm1') c.sm[1] = +v || 1; else c[f] = v;
      changed();
    });
    $$('[data-si]', card).forEach(row => { const e = c.schedule[+row.dataset.si];
      $$('[data-s]', row).forEach(sel => sel.onchange = () => { const k = sel.dataset.s; e[k] = k === 'room' ? sel.value : +sel.value; if (e.to < e.from) e.to = e.from; changed(); render(); }); });
    $$('[data-dels]', card).forEach(b => b.onclick = () => { c.schedule.splice(+b.dataset.dels, 1); changed(); render(); });
    $('[data-adds]', card).onclick = () => { c.schedule.push({day:1, from:1, to:2, room:rooms[0]}); changed(); render(); };
    { const b = document.createElement('div'); b.innerHTML = `<div class="small muted" style="margin-top:8px">Farbe:</div>${colorPicker(c.color)}`; card.appendChild(b);
      bindColorPicker(b, col => { c.color = col; changed(); render(); }); }
    $('[data-delc]', card).onclick = async () => { if (await confirmDlg(`Kurs ${esc(c.name)} mit allen Einträgen löschen?`, 'Löschen')){
      S.courses = S.courses.filter(x => x !== c); S.events = S.events.filter(e => e.cid !== c.id); S.ratings = S.ratings.filter(e => e.cid !== c.id); S.notes = S.notes.filter(e => e.cid !== c.id);
      for (const k of Object.keys(S.lessons)) if (S.lessons[k].cid === c.id) delete S.lessons[k]; changed(); render(); } };
  });
  on('oAddC', () => { const c = mkCourse('Neuer Kurs','ph','MS','',[]); c.color = autoColor(S, c); S.courses.push(c); changed(); render(); });
  $$('[data-er]', d).forEach(b => b.onclick = () => openRoomEditor(b.dataset.er));
  $$('[data-dr]', d).forEach(b => b.onclick = async () => { const r = b.dataset.dr;
    if (S.courses.some(c => c.schedule.some(e => e.room === r))) return toast('Raum wird noch im Stundenplan verwendet.');
    if (await confirmDlg(`Raum ${esc(r)} löschen?`, 'Löschen')){ delete S.rooms[r]; changed(); render(); } });
  on('oAddR', () => { const id = $('#oRoomId', d).value.trim(); if (!id) return; if (S.rooms[id]) return toast('Gibt es schon.');
    S.rooms[id] = {id, name:'Raum '+id, tables:[], board:{x:500, y:700, w:390, h:54}}; changed(); openRoomEditor(id); });
  on('oSlotsOk', () => {
    const out = [];
    for (const line of $('#oSlots', d).value.split('\n')){ const m = line.match(/(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/); if (m) out.push([m[1].padStart(5,'0'), m[2].padStart(5,'0')]); }
    if (!out.length) return toast('Keine gültigen Zeilen gefunden.');
    S.settings.slots = out; changed(); toast('Stundenraster übernommen.'); render(); });
  on('oHolOk', () => {
    const out = [];
    for (const line of $('#oHol', d).value.split('\n')){ const m = line.match(/(\d{4}-\d{2}-\d{2})\s+(\d{4}-\d{2}-\d{2})?\s*(.*)/); if (m) out.push({from:m[1], to:m[2]||m[1], label:(m[3]||'frei').trim()}); }
    S.settings.holidays = out.sort((a,b) => a.from.localeCompare(b.from)); changed(); toast(`${out.length} Zeiträume übernommen.`); render(); });
  on('oSecOk', () => { const ok = x => /^\d{4}-\d{2}-\d{2}$/.test(x);
    const ys = $('#oYS', d).value.trim(), hj = $('#oHJ', d).value.trim(), ye = $('#oYE', d).value.trim();
    if (!ok(ys) || !ok(hj) || !ok(ye)) return toast('Daten als JJJJ-MM-TT eingeben.');
    Object.assign(S.settings, {yearStart:ys, hjSwitch:hj, yearEnd:ye, sectionsCustom:$('#oSec', d).value}); changed(); toast('Übernommen.'); render(); });
  $('#oSmo', d).onchange = e => { S.settings.smollyMax = clamp(+e.target.value || 3, 1, 20); changed(); };
  $('#oN', d).onchange = e => { S.settings.suggestN = clamp(+e.target.value || 10, 1, 40); changed(); };
  on('oSimOk', () => { const v = $('#oSim', d).value; if (!v) return; simOffset = new Date(v) - Date.now(); try{ sessionStorage.setItem('lt_sim', simOffset); }catch(e){}
    unlockedDay = ymd(now()); toast('Uhrzeit simuliert: ' + new Date(v).toLocaleString('de-DE')); route(false); });
  on('oSimOff', () => { simOffset = 0; try{ sessionStorage.removeItem('lt_sim'); }catch(e){} unlockedDay = ymd(now()); toast('Echte Uhrzeit.'); render(); });
  on('oDemo', () => { let n = 0; for (const c of S.courses) if (!activeStudents(c).length){ addDemo(c); n++; } toast(n ? `Demo-Namen in ${n} Kurse eingefügt.` : 'Alle Kurse haben schon Namen.'); render(); });
  on('oDemoDel', async () => { if (!await confirmDlg('Alle Demo-Schüler und ihre Einträge löschen?', 'Löschen')) return;
    const ids = new Set(); for (const c of S.courses){ c.students.filter(s => s.demo).forEach(s => ids.add(s.id)); c.students = c.students.filter(s => !s.demo); }
    S.events = S.events.filter(e => !ids.has(e.sid)); S.ratings = S.ratings.filter(e => !ids.has(e.sid)); S.notes = S.notes.filter(e => !ids.has(e.sid)); changed(); render(); });
}
async function changePassword(){
  const a = await askPassword('Neues Passwort (mind. 8 Zeichen):'); if (a == null) return;
  if (a.length < 8) return toast('Mindestens 8 Zeichen.');
  const b = await askPassword('Neues Passwort wiederholen:'); if (b !== a) return toast('Stimmt nicht überein.');
  SALT = b64(crypto.getRandomValues(new Uint8Array(16))); KEY = await deriveKey(a, SALT);
  if (S.settings.rememberDay) await storeDayKey();
  await saveNow(); toast('Passwort geändert. Am anderen Gerät beim nächsten Abgleich das neue Passwort eingeben.');
}

boot().catch(e => { console.error(e); lockBox(`<h2>Fehler beim Start</h2><p>${esc(e.message)}</p>`); });
</script>
</body>
</html>
